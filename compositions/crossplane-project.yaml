---
# Crossplane CLI project holding every shared XRD and Composition. Flux applies
# apis/ through kustomization.yaml; this file is only read by the CLI.
apiVersion: dev.crossplane.io/v1alpha1
kind: Project
metadata:
  name: azure-platform
spec:
  repository: ghcr.io/sjovang/azure-crossplane-demo/azure-platform
  description: Shared Crossplane APIs for the azure-crossplane-demo platform.
  source: https://github.com/sjovang/azure-crossplane-demo
  license: MIT
  crossplane:
    version: ">=v2.4.0"
  # Keep in sync with clusters/base/crossplane/{functions,providers}/.
  dependencies:
    - type: xpkg
      xpkg:
        apiVersion: pkg.crossplane.io/v1
        kind: Function
        package: >-
          xpkg.crossplane.io/crossplane-contrib/function-patch-and-transform
        version: "v0.10.10"
    - type: xpkg
      xpkg:
        apiVersion: pkg.crossplane.io/v1
        kind: Function
        package: xpkg.crossplane.io/crossplane-contrib/function-go-templating
        version: "v0.12.4"
    - type: xpkg
      xpkg:
        apiVersion: pkg.crossplane.io/v1
        kind: Function
        package: xpkg.crossplane.io/crossplane-contrib/function-kro
        version: "v0.3.0"
    - type: xpkg
      xpkg:
        apiVersion: pkg.crossplane.io/v1
        kind: Function
        package: xpkg.crossplane.io/crossplane-contrib/function-auto-ready
        version: "v0.5.0"
    - type: xpkg
      xpkg:
        apiVersion: pkg.crossplane.io/v1
        kind: Function
        package: ghcr.io/sjovang/azure-crossplane-demo/function-azure-vm-sku
        version: "v0.1.0"
    - type: xpkg
      xpkg:
        apiVersion: pkg.crossplane.io/v1
        kind: Function
        package: xpkg.upbound.io/upbound/function-msgraph
        version: "v0.8.0"
    - type: xpkg
      xpkg:
        apiVersion: pkg.crossplane.io/v1
        kind: Provider
        package: xpkg.upbound.io/upbound/provider-azure-authorization
        version: "v2.7.2"
    - type: xpkg
      xpkg:
        apiVersion: pkg.crossplane.io/v1
        kind: Provider
        package: xpkg.upbound.io/upbound/provider-azure-compute
        version: "v2.7.2"
    - type: xpkg
      xpkg:
        apiVersion: pkg.crossplane.io/v1
        kind: Provider
        package: xpkg.upbound.io/upbound/provider-azure-cognitiveservices
        version: "v2.7.2"
    - type: xpkg
      xpkg:
        apiVersion: pkg.crossplane.io/v1
        kind: Provider
        package: xpkg.upbound.io/upbound/provider-azure-containerapp
        version: "v2.7.2"
    - type: xpkg
      xpkg:
        apiVersion: pkg.crossplane.io/v1
        kind: Provider
        package: xpkg.upbound.io/upbound/provider-azure-dbforpostgresql
        version: "v2.7.2"
    - type: xpkg
      xpkg:
        apiVersion: pkg.crossplane.io/v1
        kind: Provider
        package: xpkg.upbound.io/upbound/provider-azure-keyvault
        version: "v2.7.2"
    - type: xpkg
      xpkg:
        apiVersion: pkg.crossplane.io/v1
        kind: Provider
        package: xpkg.upbound.io/upbound/provider-azure-network
        version: "v2.7.2"
    - type: xpkg
      xpkg:
        apiVersion: pkg.crossplane.io/v1
        kind: Provider
        package: xpkg.upbound.io/upbound/provider-azure-web
        version: "v2.7.2"
    - type: xpkg
      xpkg:
        apiVersion: pkg.crossplane.io/v1
        kind: Provider
        package: xpkg.upbound.io/upbound/provider-azuread
        version: "v2.4.0"
