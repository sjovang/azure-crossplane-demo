---
# yamllint disable rule:line-length
resourceIds:
  - passwordGenerator
  - passwordExternalSecret
  - databaseCredentials
  - resourceGroup
  - database
  - keyVault
  - keyVaultSecret
  - enterpriseApp
  - entraClientSecret
  - appService
appSettings:
  DATABASE_HOST: ${database.status.fqdn}
  DATABASE_NAME: '${schema.spec.?databaseName.orValue(schema.spec.name)}'
  DATABASE_USER: ${schema.spec.databaseAdminUsername}
  APPLICATION_URL: 'https://${schema.spec.?customDomain.?hostname.orValue("app-" + schema.spec.name + ".azurewebsites.net")}'
keyVaultSecretAppSettings:
  DATABASE_PASSWORD:
    vaultName: ${keyVault.spec.vaultName}
    secretName: ${keyVaultSecret.spec.name}
customDomain:
  hostname: '${schema.spec.?customDomain.?hostname.orValue("")}'
  dnsZone: '${schema.spec.?customDomain.?dnsZone.orValue("")}'
  dnsZoneResourceGroup: '${schema.spec.?customDomain.?dnsZoneResourceGroup.orValue("")}'
status:
  id: ${resourceGroup.status.id}
  resourceGroupId: ${resourceGroup.status.id}
  databaseId: ${database.status.id}
  databaseFqdn: ${database.status.fqdn}
  applicationId: ${appService.status.id}
  applicationHostname: ${appService.status.defaultHostname}
  applicationUrl: ${appService.status.url}
  enterpriseApplicationId: ${enterpriseApp.?status.?id.orValue("")}
  enterpriseApplicationClientId: ${enterpriseApp.?status.?clientId.orValue("")}
