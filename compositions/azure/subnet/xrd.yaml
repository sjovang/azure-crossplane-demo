apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: xsubnets.azure.platform.example.org
spec:
  scope: Namespaced
  group: azure.platform.example.org
  names:
    kind: XSubnet
    plural: xsubnets
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                name:
                  type: string
                  description: Name of the Azure Subnet.
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: name is immutable
                resourceGroupRef:
                  type: object
                  description: Reference to the resource group hosting the Subnet and NSG.
                  properties:
                    name:
                      type: string
                      description: Logical name of the XResourceGroup.
                  required:
                    - name
                virtualNetworkRef:
                  type: object
                  description: Reference to the parent XVirtualNetwork.
                  properties:
                    name:
                      type: string
                      description: Logical name of the XVirtualNetwork.
                  required:
                    - name
                ipamAllocation:
                  type: object
                  description: Allocate address space dynamically from the parent Virtual Network / IPAM pool.
                  properties:
                    numberOfAllocatedIpAddresses:
                      type: integer
                      default: 256
                      description: Number of IP addresses to allocate (e.g. 256 for a /24).
                    ipamPoolId:
                      type: string
                      description: Resource ID of the IPAM pool.
                  required:
                    - numberOfAllocatedIpAddresses
                location:
                  type: string
                  default: swedencentral
                  description: Azure region for the Network Security Group.
                securityRules:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        description: Name of the security rule.
                      priority:
                        type: integer
                        minimum: 100
                        maximum: 4096
                        description: Priority between 100 and 4096.
                      direction:
                        type: string
                        enum:
                          - Inbound
                          - Outbound
                        default: Inbound
                        description: Direction of network traffic.
                      access:
                        type: string
                        enum:
                          - Allow
                          - Deny
                        default: Allow
                        description: Access action for the rule.
                      protocol:
                        type: string
                        enum:
                          - Tcp
                          - Udp
                          - Icmp
                          - "*"
                        default: Tcp
                        description: Network protocol.
                      destinationPortRange:
                        type: string
                        default: "*"
                        description: Destination port or range (e.g. 22 or 80-443).
                      sourceAddressPrefix:
                        type: string
                        default: "*"
                        description: Source CIDR or tag.
                      destinationAddressPrefix:
                        type: string
                        default: "*"
                        description: Destination CIDR or tag.
                    required:
                      - name
                      - priority
                  description: Configurable Network Security Group rules.
                tags:
                  type: object
                  nullable: true
                  default: null
                  additionalProperties:
                    type: string
                  description: Optional tags to apply to the resources.
              required:
                - name
                - resourceGroupRef
                - virtualNetworkRef
            status:
              type: object
              properties:
                id:
                  type: string
                  description: Azure resource ID of the Subnet.
                subnetId:
                  type: string
                  description: Azure resource ID of the Subnet.
                networkSecurityGroupId:
                  type: string
                  description: Azure resource ID of the attached Network Security Group.
          required:
            - spec
