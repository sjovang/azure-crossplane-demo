---
apiVersion: web.azure.m.upbound.io/v1beta1
kind: ServicePlan
metadata:
  annotations:
    gotemplating.fn.crossplane.io/composition-resource-name: servicePlan
    crossplane.io/external-name: asp-appservicedemo01
spec:
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
  forProvider:
    location: swedencentral
    resourceGroupName: rg-crd-dev-apps
    osType: Linux
    skuName: B1
---
apiVersion: web.azure.m.upbound.io/v1beta1
kind: LinuxWebApp
metadata:
  annotations:
    gotemplating.fn.crossplane.io/composition-resource-name: linuxWebApp
    crossplane.io/external-name: app-appservicedemo01
spec:
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
  forProvider:
    location: swedencentral
    resourceGroupName: rg-crd-dev-apps
    servicePlanIdSelector:
      matchControllerRef: true
    authSettings:
      enabled: false
    siteConfig:
      applicationStack:
        dockerImageName: docker.io/library/nginx:latest
    appSettings:
      WEBSITES_PORT: "80"
