---
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: xappservices.azure.platform.example.org
spec:
  scope: Namespaced
  group: azure.platform.example.org
  names:
    kind: XAppService
    plural: xappservices
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                name:
                  type: string
                  description: Name of the App Service.
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: name is immutable
                resourceGroupRef:
                  type: object
                  description: Resource group hosting the App Service.
                  properties:
                    name:
                      type: string
                      description: Logical name of the XResourceGroup.
                  required:
                    - name
                size:
                  type: string
                  enum:
                    - small
                    - medium
                    - large
                  default: small
                  description: >-
                    T-shirt size: small = B1, medium = P1v3, large = P2v3.
                image:
                  type: string
                  description: >-
                    Container image reference to run, e.g.
                    docker.io/library/nginx:latest.
                port:
                  type: integer
                  default: 8080
                  description: Port the container listens on.
                envVars:
                  type: object
                  nullable: true
                  default: null
                  additionalProperties:
                    type: string
                  description: >-
                    Plain (non-secret) application settings exposed to the
                    container as environment variables.
                location:
                  type: string
                  default: swedencentral
                  description: Azure region for the App Service.
              required:
                - name
                - resourceGroupRef
                - image
            status:
              type: object
              properties:
                id:
                  type: string
                  description: Azure resource ID of the Linux Web App.
                servicePlanId:
                  type: string
                  description: Azure resource ID of the App Service Plan.
                defaultHostname:
                  type: string
                  description: Default public hostname of the App Service.
          required:
            - spec
