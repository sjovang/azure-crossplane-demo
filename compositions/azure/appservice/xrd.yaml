---
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: xappservices.azure.platform.example.org
spec:
  scope: Namespaced
  group: azure.platform.example.org
  names:
    kind: XAppService
    plural: xappservices
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                name:
                  type: string
                  description: Name of the App Service.
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: name is immutable
                resourceGroupRef:
                  type: object
                  description: Resource group hosting the App Service.
                  properties:
                    name:
                      type: string
                      description: Logical name of the XResourceGroup.
                  required:
                    - name
                size:
                  type: string
                  enum:
                    - small
                    - medium
                    - large
                  default: small
                  description: >-
                    T-shirt size: small = B1, medium = P1v3, large = P2v3.
                image:
                  type: string
                  description: >-
                    Container image reference to run, e.g.
                    docker.io/library/nginx:latest.
                port:
                  type: integer
                  default: 8080
                  description: Port the container listens on.
                envVars:
                  type: object
                  nullable: true
                  default: null
                  additionalProperties:
                    type: string
                  description: >-
                    Plain (non-secret) application settings exposed to the
                    container as environment variables.
                keyVaultSecretEnvVars:
                  type: object
                  nullable: true
                  default: null
                  additionalProperties:
                    type: object
                    properties:
                      vaultName:
                        type: string
                        description: Azure Key Vault name.
                      secretName:
                        type: string
                        description: Azure Key Vault secret name.
                    required:
                      - vaultName
                      - secretName
                  description: >-
                    Application settings resolved through App Service Key
                    Vault references. The XAppService identity must have Key
                    Vault Secrets User on each referenced vault.
                systemAssignedIdentity:
                  type: boolean
                  default: false
                  description: >-
                    Enable a system-assigned managed identity for the App
                    Service.
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: systemAssignedIdentity is immutable
                location:
                  type: string
                  default: swedencentral
                  description: Azure region for the App Service.
                customDomain:
                  type: object
                  description: >-
                    Optional custom hostname with a free App Service managed
                    certificate. The CNAME and asuid TXT records are created
                    in an existing Azure public DNS zone. Omitted or empty
                    fields mean no custom domain.
                  properties:
                    hostname:
                      type: string
                      description: >-
                        Fully qualified hostname inside dnsZone, e.g.
                        portal.example.com.
                    dnsZone:
                      type: string
                      description: Existing Azure public DNS zone name.
                    dnsZoneResourceGroup:
                      type: string
                      description: Resource group holding the DNS zone.
                  x-kubernetes-validations:
                    - rule: >-
                        (has(self.hostname) && self.hostname != '') ==
                        (has(self.dnsZone) && self.dnsZone != '') &&
                        (has(self.hostname) && self.hostname != '') ==
                        (has(self.dnsZoneResourceGroup) &&
                        self.dnsZoneResourceGroup != '')
                      message: >-
                        hostname, dnsZone and dnsZoneResourceGroup are
                        required together
                    - rule: >-
                        !has(self.hostname) || self.hostname == '' ||
                        (has(self.dnsZone) &&
                        self.hostname.endsWith('.' + self.dnsZone))
                      message: hostname must be inside dnsZone
              required:
                - name
                - resourceGroupRef
                - image
            status:
              type: object
              properties:
                id:
                  type: string
                  description: Azure resource ID of the Linux Web App.
                servicePlanId:
                  type: string
                  description: Azure resource ID of the App Service Plan.
                defaultHostname:
                  type: string
                  description: Default public hostname of the App Service.
                url:
                  type: string
                  description: >-
                    Public HTTPS URL: the custom hostname when set, otherwise
                    the default hostname.
                identityPrincipalId:
                  type: string
                  description: >-
                    Microsoft Entra principal ID of the system-assigned
                    managed identity.
          required:
            - spec
