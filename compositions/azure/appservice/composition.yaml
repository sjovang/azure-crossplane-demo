---
# yamllint disable rule:line-length
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: appservices.azure.platform.example.org
spec:
  compositeTypeRef:
    apiVersion: azure.platform.example.org/v1alpha1
    kind: XAppService
  mode: Pipeline
  pipeline:
    - step: render-appservice
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr := .observed.composite.resource -}}
            {{- /* App Service needs the registry separately from the image. */ -}}
            {{- $registry := "index.docker.io" -}}
            {{- $imageName := $xr.spec.image -}}
            {{- $registryPrefix := regexFind "^[^/]*[.:][^/]*/" $xr.spec.image -}}
            {{- if $registryPrefix -}}
            {{- $registry = trimSuffix "/" $registryPrefix -}}
            {{- $imageName = trimPrefix $registryPrefix $xr.spec.image -}}
            {{- end -}}
            {{- if eq $registry "docker.io" -}}
            {{- $registry = "index.docker.io" -}}
            {{- end -}}
            {{- $domain := dict -}}
            {{- if and $xr.spec.customDomain $xr.spec.customDomain.hostname -}}
            {{- $domain = $xr.spec.customDomain -}}
            {{- end }}
            ---
            apiVersion: web.azure.m.upbound.io/v1beta1
            kind: ServicePlan
            metadata:
              annotations:
                {{ setResourceNameAnnotation "servicePlan" }}
                crossplane.io/external-name: asp-{{ $xr.spec.name }}
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                location: {{ $xr.spec.location }}
                resourceGroupName: rg-{{ $xr.spec.resourceGroupRef.name }}
                osType: Linux
                skuName: {{ if eq $xr.spec.size "small" }}B1{{ else if eq $xr.spec.size "medium" }}P1v3{{ else }}P2v3{{ end }}
            ---
            apiVersion: web.azure.m.upbound.io/v1beta1
            kind: LinuxWebApp
            metadata:
              annotations:
                {{ setResourceNameAnnotation "linuxWebApp" }}
                crossplane.io/external-name: app-{{ $xr.spec.name }}
            spec:
            {{- if $domain }}
              # The domain verification ID is sensitive, so the provider
              # only publishes it as a connection detail.
              writeConnectionSecretToRef:
                name: app-{{ $xr.spec.name }}-connection
            {{- end }}
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                location: {{ $xr.spec.location }}
                resourceGroupName: rg-{{ $xr.spec.resourceGroupRef.name }}
                servicePlanIdSelector:
                  matchControllerRef: true
            {{- if $xr.spec.systemAssignedIdentity }}
                identity:
                  type: SystemAssigned
            {{- end }}
                # Explicit authSettings avoids a Read panic in the provider:
                # https://github.com/crossplane-contrib/provider-upjet-azure/issues/1202
                authSettings:
                  enabled: false
                siteConfig:
                  applicationStack:
                    dockerImageName: {{ $imageName }}
                    dockerRegistryUrl: https://{{ $registry }}
                appSettings:
                  WEBSITES_PORT: "{{ $xr.spec.port }}"
            {{- if $xr.spec.envVars }}
            {{ toYaml $xr.spec.envVars | nindent 6 }}
            {{- end }}
            {{- if $domain }}
            {{- $record := trimSuffix (printf ".%s" $domain.dnsZone) $domain.hostname }}
            ---
            apiVersion: network.azure.m.upbound.io/v1beta1
            kind: DNSCNAMERecord
            metadata:
              annotations:
                {{ setResourceNameAnnotation "dnsCnameRecord" }}
                crossplane.io/external-name: {{ $record }}
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                resourceGroupName: {{ $domain.dnsZoneResourceGroup }}
                zoneName: {{ $domain.dnsZone }}
                ttl: 300
                record: app-{{ $xr.spec.name }}.azurewebsites.net
            {{- $observedWebApp := get (.observed.resources | default dict) "linuxWebApp" | default dict }}
            {{- $verificationId := get ($observedWebApp.connectionDetails | default dict) "attribute.custom_domain_verification_id" | b64dec }}
            {{- if $verificationId }}
            ---
            # App Service only binds a hostname once asuid.<record> proves
            # ownership of the domain.
            apiVersion: network.azure.m.upbound.io/v1beta1
            kind: DNSTXTRecord
            metadata:
              annotations:
                {{ setResourceNameAnnotation "dnsTxtRecord" }}
                crossplane.io/external-name: asuid.{{ $record }}
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                resourceGroupName: {{ $domain.dnsZoneResourceGroup }}
                zoneName: {{ $domain.dnsZone }}
                ttl: 300
                record:
                  - value: {{ $verificationId | quote }}
            {{- end }}
            {{- if and (getComposedResource . "dnsCnameRecord") (getComposedResource . "dnsTxtRecord") }}
            ---
            apiVersion: web.azure.m.upbound.io/v1beta1
            kind: AppServiceCustomHostNameBinding
            metadata:
              annotations:
                {{ setResourceNameAnnotation "customHostnameBinding" }}
                crossplane.io/external-name: {{ $domain.hostname }}
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                appServiceName: app-{{ $xr.spec.name }}
                resourceGroupName: rg-{{ $xr.spec.resourceGroupRef.name }}
            ---
            apiVersion: web.azure.m.upbound.io/v1beta1
            kind: AppServiceManagedCertificate
            metadata:
              annotations:
                {{ setResourceNameAnnotation "managedCertificate" }}
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                customHostnameBindingIdSelector:
                  matchControllerRef: true
            ---
            apiVersion: web.azure.m.upbound.io/v1beta1
            kind: AppServiceCertificateBinding
            metadata:
              annotations:
                {{ setResourceNameAnnotation "certificateBinding" }}
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                hostnameBindingIdSelector:
                  matchControllerRef: true
                certificateIdSelector:
                  matchControllerRef: true
                sslState: SniEnabled
            {{- end }}
            {{- end }}
            {{- $linuxWebApp := getComposedResource . "linuxWebApp" }}
            {{- $servicePlan := getComposedResource . "servicePlan" }}
            {{- if and $linuxWebApp $servicePlan }}
            ---
            apiVersion: azure.platform.example.org/v1alpha1
            kind: XAppService
            status:
              id: {{ $linuxWebApp.status.atProvider.id }}
              servicePlanId: {{ $servicePlan.status.atProvider.id }}
              defaultHostname: {{ $linuxWebApp.status.atProvider.defaultHostname }}
              url: https://{{ if $domain }}{{ $domain.hostname }}{{ else }}{{ $linuxWebApp.status.atProvider.defaultHostname }}{{ end }}
            {{- if and $xr.spec.systemAssignedIdentity $linuxWebApp.status.atProvider.identity }}
              identityPrincipalId: {{ $linuxWebApp.status.atProvider.identity.principalId }}
            {{- end }}
            {{- end }}
    - step: auto-ready
      functionRef:
        name: function-auto-ready
