---
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: xvirtualmachines.azure.platform.example.org
spec:
  scope: Namespaced
  group: azure.platform.example.org
  names:
    kind: XVirtualMachine
    plural: xvirtualmachines
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 12
                  description: Name of the virtual machine.
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: name is immutable
                os:
                  type: string
                  enum:
                    - linux
                    - windows
                  description: >-
                    Operating system: linux installs the latest AlmaLinux,
                    windows installs the latest Windows Server.
                size:
                  type: string
                  enum:
                    - small
                    - medium
                    - large
                  default: small
                  description: >-
                    T-shirt size: small = 2 vCPU, medium = 4 vCPU,
                    large = 8 vCPU.
                resourceGroupRef:
                  type: object
                  description: Resource group hosting the virtual machine.
                  properties:
                    name:
                      type: string
                      description: Logical name of the XResourceGroup.
                  required:
                    - name
                virtualNetworkRef:
                  type: object
                  description: Virtual network and subnet hosting the NIC.
                  properties:
                    name:
                      type: string
                      description: Logical name of the XVirtualNetwork.
                    subnet:
                      type: string
                      description: Name of the subnet within that network.
                  required:
                    - name
                    - subnet
                adminUsername:
                  type: string
                  default: azureuser
                  description: Local administrator user name.
                adminPasswordSecretRef:
                  type: object
                  description: >-
                    Windows only. Secret in the same namespace holding the
                    local administrator password.
                  properties:
                    name:
                      type: string
                    key:
                      type: string
                      default: password
                  required:
                    - name
                    - key
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: adminPasswordSecretRef is immutable
                sshPublicKeySecretRef:
                  type: object
                  description: >-
                    Linux only. Secret in the same namespace holding the
                    OpenSSH public key authorised for the admin user.
                  properties:
                    name:
                      type: string
                    key:
                      type: string
                      default: id_rsa.pub
                  required:
                    - name
                    - key
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: sshPublicKeySecretRef is immutable
                location:
                  type: string
                  default: swedencentral
                  description: Azure region for the virtual machine.
              required:
                - name
                - os
                - resourceGroupRef
                - virtualNetworkRef
              x-kubernetes-validations:
                - rule: self.os != 'linux' || has(self.sshPublicKeySecretRef)
                  message: linux virtual machines require sshPublicKeySecretRef
                - rule: self.os != 'linux' || !has(self.adminPasswordSecretRef)
                  message: >-
                    linux virtual machines authenticate with SSH keys only,
                    remove adminPasswordSecretRef
                - rule: >-
                    self.os != 'windows' || has(self.adminPasswordSecretRef)
                  message: >-
                    windows virtual machines require adminPasswordSecretRef
                - rule: self.os != 'windows' || !has(self.sshPublicKeySecretRef)
                  message: >-
                    windows virtual machines do not support
                    sshPublicKeySecretRef
            status:
              type: object
              properties:
                id:
                  type: string
                  description: Azure resource ID of the virtual machine.
                vmSize:
                  type: string
                  description: Azure VM SKU resolved from the requested size.
                privateIp:
                  type: string
                  description: Private IP address assigned to the NIC.
                networkInterfaceId:
                  type: string
                  description: Azure resource ID of the network interface.
          required:
            - spec
