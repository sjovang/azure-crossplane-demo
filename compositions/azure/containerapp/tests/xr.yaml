---
apiVersion: azure.platform.example.org/v1alpha1
kind: XContainerApp
metadata:
  name: test-containerapp
  namespace: test
spec:
  name: test-containerapp
  size: small
  resourceGroupRef:
    name: test
  image: docker.io/library/nginx:latest
  port: 80
  minReplicas: 1
  maxReplicas: 2
  envVars:
    LOG_LEVEL: info
