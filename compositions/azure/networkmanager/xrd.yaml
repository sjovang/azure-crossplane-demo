---
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: xnetworkmanagers.azure.platform.example.org
spec:
  scope: Namespaced
  group: azure.platform.example.org
  names:
    kind: XNetworkManager
    plural: xnetworkmanagers
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                name:
                  type: string
                  description: Logical name of the Network Manager.
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: name is immutable
                subscriptionId:
                  type: string
                  description: >-
                    Azure subscription containing the Network Manager.
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: subscriptionId is immutable
                resourceGroupRef:
                  type: object
                  description: >-
                    Reference to the resource group hosting the Network Manager.
                  properties:
                    name:
                      type: string
                      description: Logical name of the XResourceGroup.
                  required:
                    - name
                location:
                  type: string
                  default: swedencentral
                  description: >-
                    Azure region for the Network Manager.
                tags:
                  type: object
                  nullable: true
                  default: null
                  additionalProperties:
                    type: string
                  description: Optional tags to apply to the Network Manager.
              required:
                - name
                - subscriptionId
                - resourceGroupRef
            status:
              type: object
              properties:
                id:
                  type: string
                  description: Azure resource ID of the Network Manager.
          required:
            - spec
