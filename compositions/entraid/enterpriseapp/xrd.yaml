---
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: xenterpriseapps.entraid.platform.example.org
spec:
  scope: Namespaced
  group: entraid.platform.example.org
  names:
    kind: XEnterpriseApp
    plural: xenterpriseapps
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  description: Display name of the Entra ID application.
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: name is immutable
                redirectUris:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    pattern: "^https?://"
                  description: OAuth web redirect URIs allowed for the app.
                rotationInterval:
                  type: string
                  default: 720h
                  pattern: "^[1-9][0-9]*h$"
                  description: >-
                    How often External Secrets changes the password rotation
                    trigger. Defaults to 30 days.
                credentialValidity:
                  type: string
                  default: 1440h
                  pattern: "^[1-9][0-9]*h$"
                  description: >-
                    Validity of each generated client secret. Defaults to 60
                    days to tolerate a delayed rotation reconciliation.
              required:
                - name
                - redirectUris
            status:
              type: object
              properties:
                id:
                  type: string
                  description: Provider ID of the Entra application.
                clientId:
                  type: string
                  description: Application (client) ID.
                objectId:
                  type: string
                  description: Object ID of the application registration.
                servicePrincipalId:
                  type: string
                  description: Object ID of the enterprise service principal.
                connectionSecretName:
                  type: string
                  description: >-
                    Kubernetes Secret containing the generated client secret
                    under the value key.
                rotationRevision:
                  type: string
                  description: >-
                    Non-secret revision that changes whenever credential
                    rotation is triggered.
          required:
            - spec
