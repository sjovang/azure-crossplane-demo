---
apiVersion: entraid.platform.example.org/v1alpha1
kind: XAccessPackageCatalog
customTypes:
  GroupRef:
    name: string | required=true minLength=1
  GroupAssociation:
    groupId: string | description="Entra group object ID."
    id: string | description="Provider ID of the catalog resource association."
    ready: boolean | description="Whether the association is Ready."
spec:
  name: >-
    string | required=true minLength=1
    description="Display name of the access package catalog."
  description: >-
    string | required=true minLength=1
    description="Description of the access package catalog."
  externallyVisible: >-
    boolean | default=false
    description="Whether guests can request packages in this catalog."
  groupIds: >-
    []string | default=[]
    description="Object IDs from XSecurityGroup.status.objectId to register
    once as shared catalog resources. Packages may select any subset."
  groupRefs: >-
    []GroupRef | default=[]
    description="Same-namespace XSecurityGroup names to register once as shared
    catalog resources. Object IDs are resolved from group status."
  readerGroupIds: >-
    []string | default=[]
    description="Object IDs from XSecurityGroup.status.objectId to grant the
    Catalog Reader role."
status:
  id: string | description="Provider ID of the Entra access package catalog."
  groupAssociations: >-
    []GroupAssociation
    | description="Catalog-owned group associations referenced by packages."
