---
# yamllint disable rule:line-length
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: accesspackagecatalogs.entraid.platform.example.org
spec:
  compositeTypeRef:
    apiVersion: entraid.platform.example.org/v1alpha1
    kind: XAccessPackageCatalog
  mode: Pipeline
  pipeline:
    - step: kro
      functionRef:
        name: function-kro
      input:
        apiVersion: kro.fn.crossplane.io/v1alpha1
        kind: ResourceGraph
        status:
          id: ${catalog.status.atProvider.id}
        resources:
          - id: catalog
            template:
              apiVersion: identitygovernance.azuread.m.upbound.io/v1beta1
              kind: AccessPackageCatalog
              metadata: {}
              spec:
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  displayName: ${schema.spec.name}
                  description: ${schema.spec.description}
                  externallyVisible: ${schema.spec.externallyVisible}
                  published: true
          - id: catalogReaderRoleAssignments
            forEach:
              - groupId: ${schema.spec.readerGroupIds}
            template:
              apiVersion: identitygovernance.azuread.m.upbound.io/v1beta1
              kind: AccessPackageCatalogRoleAssignment
              metadata:
                name: >-
                  ${("reader-" + schema.metadata.uid
                  + "." + groupId).lowerAscii()}
              spec:
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  catalogId: ${catalog.status.atProvider.id}
                  principalObjectId: ${groupId}
                  roleId: 44272f93-9762-48e8-af59-1b5351b1d6b3
    # Dynamic name references need one required-resource request per group.
    # Preserve the old kro collection keys so existing associations stay owned.
    - step: group-resources
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr := .observed.composite.resource -}}
            {{- $extra := .extraResources | default dict -}}
            {{- $groups := list -}}
            {{- $pending := false -}}
            {{- range $id := $xr.spec.groupIds -}}
            {{- $groups = append $groups (lower $id) -}}
            {{- end -}}
            ---
            apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
            kind: ExtraResources
            requirements:
            {{- range $ref := $xr.spec.groupRefs }}
              {{ printf "group-%s" $ref.name }}:
                apiVersion: entraid.platform.example.org/v1alpha1
                kind: XSecurityGroup
                matchName: {{ $ref.name | quote }}
                namespace: {{ $xr.metadata.namespace | quote }}
            {{- end -}}
            {{- range $ref := $xr.spec.groupRefs -}}
            {{- $items := (get $extra (printf "group-%s" $ref.name) | default dict).items | default list -}}
            {{- if ne (len $items) 1 -}}
            {{- $pending = true -}}
            {{- else -}}
            {{- $group := (index $items 0).resource -}}
            {{- $id := ($group.status | default dict).objectId | default "" -}}
            {{- $ready := false -}}
            {{- range $condition := ($group.status | default dict).conditions -}}
            {{- if and (eq $condition.type "Ready") (eq $condition.status "True") -}}
            {{- $ready = true -}}
            {{- end -}}
            {{- end -}}
            {{- if or (not $id) (not $ready) -}}
            {{- $pending = true -}}
            {{- else -}}
            {{- $groups = append $groups (lower $id) -}}
            {{- end -}}
            {{- end -}}
            {{- end -}}
            {{- $groups = uniq $groups -}}
            {{- $catalog := getComposedResource . "catalog" | default dict -}}
            {{- $catalogId := (($catalog.status | default dict).atProvider | default dict).id -}}
            {{- if $pending -}}
            {{- range $key, $resource := .observed.resources -}}
            {{- if not (get $.desired.resources $key) -}}
            {{- $preserved := deepCopy $resource.resource -}}
            {{- $_ := set $preserved.metadata.annotations "gotemplating.fn.crossplane.io/composition-resource-name" $key }}
            ---
            {{ $preserved | toJson }}
            {{- end -}}
            {{- end -}}
            {{- end -}}
            {{- $associations := list -}}
            {{- if and (not $pending) $catalogId -}}
            {{- range $id := $groups -}}
            {{- $name := printf "catalog-%s.%s" $xr.metadata.uid $id -}}
            {{- $key := printf "groupCatalogAssociations-%s" $name -}}
            {{- $observed := getComposedResource $ $key | default dict -}}
            {{- $status := $observed.status | default dict -}}
            {{- $ready := false -}}
            {{- range $condition := $status.conditions -}}
            {{- if and (eq $condition.type "Ready") (eq $condition.status "True") -}}
            {{- $ready = true -}}
            {{- end -}}
            {{- end -}}
            {{- $associations = append $associations (dict "groupId" $id "id" (($status.atProvider | default dict).id | default "") "ready" $ready) }}
            ---
            apiVersion: identitygovernance.azuread.m.upbound.io/v1beta1
            kind: AccessPackageResourceCatalogAssociation
            metadata:
              name: {{ $name }}
              namespace: {{ $xr.metadata.namespace }}
              annotations:
                {{ setResourceNameAnnotation $key }}
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                catalogId: {{ $catalogId | quote }}
                resourceOriginId: {{ (($observed.spec | default dict).forProvider | default dict).resourceOriginId | default $id | quote }}
                resourceOriginSystem: AadGroup
            {{- end -}}
            {{- end }}
            ---
            apiVersion: entraid.platform.example.org/v1alpha1
            kind: XAccessPackageCatalog
            metadata:
            {{- if or $pending (and (gt (len $groups) 0) (not $catalogId)) }}
              annotations:
                gotemplating.fn.crossplane.io/ready: "False"
            {{- else }}
              {}
            {{- end }}
            status:
              groupAssociations: {{ $associations | toJson }}
            ---
            apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
            kind: ClaimConditions
            conditions:
              - type: GroupResourcesReady
                status: {{ ternary "False" "True" $pending | quote }}
                reason: {{ ternary "WaitingForGroups" "Available" $pending }}
                message: {{ ternary "All requested group references must resolve to Ready groups with object IDs." "All requested group references are resolved." $pending }}
    - step: auto-ready
      functionRef:
        name: function-auto-ready
