---
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: accesspackagecatalogs.entraid.platform.example.org
spec:
  compositeTypeRef:
    apiVersion: entraid.platform.example.org/v1alpha1
    kind: XAccessPackageCatalog
  mode: Pipeline
  pipeline:
    - step: kro
      functionRef:
        name: function-kro
      input:
        apiVersion: kro.fn.crossplane.io/v1alpha1
        kind: ResourceGraph
        status:
          id: ${catalog.status.atProvider.id}
        resources:
          - id: catalog
            template:
              apiVersion: identitygovernance.azuread.m.upbound.io/v1beta1
              kind: AccessPackageCatalog
              metadata: {}
              spec:
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  displayName: ${schema.spec.name}
                  description: ${schema.spec.description}
                  externallyVisible: ${schema.spec.externallyVisible}
                  published: true
          - id: catalogReaderRoleAssignments
            forEach:
              - groupId: ${schema.spec.readerGroupIds}
            template:
              apiVersion: identitygovernance.azuread.m.upbound.io/v1beta1
              kind: AccessPackageCatalogRoleAssignment
              metadata: {}
              spec:
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  catalogId: ${catalog.status.atProvider.id}
                  principalObjectId: ${groupId}
                  roleId: 43169555-5d4b-426f-9d2e-79aa311d0570
    - step: auto-ready
      functionRef:
        name: function-auto-ready
