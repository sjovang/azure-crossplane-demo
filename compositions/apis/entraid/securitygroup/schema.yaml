---
apiVersion: entraid.platform.example.org/v1alpha1
kind: XSecurityGroup
customTypes:
  ResolvedUser:
    id: string
    displayName: string
    userPrincipalName: string
    mail: string
    accountEnabled: boolean
spec:
  name: >-
    string | required=true minLength=1
    description="Display name of the Entra ID security group."
  # function-msgraph fails if the referenced field is absent, hence the
  # empty-list defaults.
  members: >-
    []string | default=[]
    description="Optional user principal names (UPNs) to add as members."
  owners: >-
    []string | default=[]
    description="Optional user principal names (UPNs) to add as owners.
    When empty, the Crossplane service principal owns the group."
status:
  id: string | description="Provider ID of the Entra ID group."
  objectId: string | description="Object ID of the Entra ID group."
  resolvedMembers: >-
    []ResolvedUser
    | description="Members found in Entra ID (set by function-msgraph)."
  resolvedOwners: >-
    []ResolvedUser
    | description="Owners found in Entra ID (set by function-msgraph)."
  unresolvedMembers: >-
    []string | description="Member UPNs not (yet) found in Entra ID."
  unresolvedOwners: >-
    []string | description="Owner UPNs not (yet) found in Entra ID."
