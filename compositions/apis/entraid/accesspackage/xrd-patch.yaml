---
# yamllint disable rule:line-length
properties:
  spec:
    required:
      - catalogRef
      - primaryApproverGroupRef
      - secondaryApproverGroupRef
    properties:
      groupIds:
        uniqueItems: true
        items:
          pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
      requestorScope:
        pattern: "^(AllExistingDirectoryMemberUsers|AllExternalSubjects)$"
      approvalTimeoutDays:
        minimum: 1
      escalationAfterDays:
        minimum: 1
      reviewDurationDays:
        minimum: 1
      reviewFrequency:
        pattern: "^(weekly|monthly|quarterly|halfyearly|annual)$"
