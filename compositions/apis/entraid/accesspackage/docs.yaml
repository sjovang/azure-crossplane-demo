---
summary: >-
  An Entra access package that references a same-namespace catalog by
  catalogRef.name and includes a subset of its registered groupIds without
  owning catalog associations. It creates a request policy with primary and
  secondary escalation approvers referenced by same-namespace
  XSecurityGroup names, and reviews assignments quarterly. The
  secondary group is notified after seven days; requests are denied after
  fourteen days without approval. The default 14-day review window removes
  access if reviewers do not respond.
stability: experimental
commonErrors:
  - symptom: >-
      The AccessPackage, AssignmentPolicy, or association is never created.
    cause: >-
      The corresponding provider-azuread managed resource definition is not
      activated.
    # The provider MRD identifiers exceed the configured line-length limit.
    # yamllint disable rule:line-length
    fix: >-
      Add accesspackages.identitygovernance.azuread.m.upbound.io,
      accesspackageassignmentpolicies.identitygovernance.azuread.m.upbound.io,
      accesspackageresourcecatalogassociations.identitygovernance.azuread.m.upbound.io,
      and accesspackageresourcepackageassociations.identitygovernance.azuread.m.upbound.io
      to the managed resource activation policy.
    # yamllint enable rule:line-length
  - symptom: A requested group is missing or the package stays not Ready.
    cause: >-
      The referenced catalog has not registered the group, or its catalog
      association is not Ready or has no provider ID yet.
    fix: >-
      Register the group object ID in XAccessPackageCatalog.spec.groupIds
      once, wait for status.groupAssociations to report its ID and ready:
      true, then select it in each package's groupIds. Missing requested
      groups are not silently skipped. See examples/entraid-accesspackages.yaml.
  - symptom: >-
      The assignment policy or group associations report
      Authorization_RequestDenied.
    cause: >-
      The service principal lacks the Microsoft Graph application permission
      EntitlementManagement.ReadWrite.All, or admin consent is missing.
    fix: >-
      Re-run the bootstrap script as a Global Administrator or Privileged Role
      Administrator, or grant EntitlementManagement.ReadWrite.All manually.
  - symptom: Guests cannot request the access package.
    cause: >-
      The package uses AllExternalSubjects but its catalog is not externally
      visible.
    fix: >-
      Set externallyVisible: true on the XAccessPackageCatalog.
