---
# yamllint disable rule:line-length
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: accesspackages.entraid.platform.example.org
spec:
  compositeTypeRef:
    apiVersion: entraid.platform.example.org/v1alpha1
    kind: XAccessPackage
  mode: Pipeline
  pipeline:
    - step: kro
      functionRef:
        name: function-kro
      input:
        apiVersion: kro.fn.crossplane.io/v1alpha1
        kind: ResourceGraph
        status:
          id: ${accessPackage.status.atProvider.id}
          assignmentPolicyId: ${assignmentPolicy.status.atProvider.id}
        resources:
          - id: catalog
            externalRef:
              apiVersion: entraid.platform.example.org/v1alpha1
              kind: XAccessPackageCatalog
              metadata:
                name: ${schema.spec.catalogRef.name}
          - id: primaryApproverGroup
            externalRef:
              apiVersion: entraid.platform.example.org/v1alpha1
              kind: XSecurityGroup
              metadata:
                name: ${schema.spec.primaryApproverGroupRef.name}
          - id: secondaryApproverGroup
            externalRef:
              apiVersion: entraid.platform.example.org/v1alpha1
              kind: XSecurityGroup
              metadata:
                name: ${schema.spec.secondaryApproverGroupRef.name}
          - id: accessPackage
            template:
              apiVersion: identitygovernance.azuread.m.upbound.io/v1beta1
              kind: AccessPackage
              metadata: {}
              spec:
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  catalogId: ${catalog.status.id}
                  displayName: ${schema.spec.name}
                  description: ${schema.spec.description}
          - id: assignmentPolicy
            template:
              apiVersion: identitygovernance.azuread.m.upbound.io/v1beta1
              kind: AccessPackageAssignmentPolicy
              metadata: {}
              spec:
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  accessPackageId: ${accessPackage.status.atProvider.id}
                  displayName: ${schema.spec.name}
                  description: ${schema.spec.description}
                  requestorSettings:
                    requestsAccepted: true
                    scopeType: ${schema.spec.requestorScope}
                  approvalSettings:
                    approvalRequired: true
                    requestorJustificationRequired: true
                    approvalStage:
                      - approvalTimeoutInDays: ${double(schema.spec.approvalTimeoutDays)}
                        alternativeApprovalEnabled: true
                        enableAlternativeApprovalInDays: ${double(schema.spec.escalationAfterDays)}
                        primaryApprover:
                          - objectId: ${primaryApproverGroup.status.objectId}
                            subjectType: GroupMembers
                        alternativeApprover:
                          - objectId: ${secondaryApproverGroup.status.objectId}
                            subjectType: GroupMembers
                  assignmentReviewSettings:
                    enabled: true
                    reviewFrequency: ${schema.spec.reviewFrequency}
                    durationInDays: ${double(schema.spec.reviewDurationDays)}
                    reviewType: Reviewers
                    reviewer:
                      - objectId: ${primaryApproverGroup.status.objectId}
                        subjectType: GroupMembers
                      - objectId: ${secondaryApproverGroup.status.objectId}
                        subjectType: GroupMembers
                    accessReviewTimeoutBehavior: removeAccess
    # Resolve dynamic group names and fail closed before pruning associations.
    # Pending resources retain identity/spec, never observed UID or status.
    - step: check-group-resources
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr := .observed.composite.resource -}}
            {{- $extra := .extraResources | default dict -}}
            {{- $groups := list -}}
            {{- $pending := false -}}
            {{- range $id := $xr.spec.groupIds -}}
            {{- $groups = append $groups (lower $id) -}}
            {{- end -}}
            ---
            apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
            kind: ExtraResources
            requirements:
              resourceCatalog:
                apiVersion: entraid.platform.example.org/v1alpha1
                kind: XAccessPackageCatalog
                matchName: {{ $xr.spec.catalogRef.name | quote }}
                namespace: {{ $xr.metadata.namespace | quote }}
            {{- range $ref := $xr.spec.groupRefs }}
              {{ printf "group-%s" $ref.name }}:
                apiVersion: entraid.platform.example.org/v1alpha1
                kind: XSecurityGroup
                matchName: {{ $ref.name | quote }}
                namespace: {{ $xr.metadata.namespace | quote }}
            {{- end -}}
            {{- range $ref := $xr.spec.groupRefs -}}
            {{- $items := (get $extra (printf "group-%s" $ref.name) | default dict).items | default list -}}
            {{- if ne (len $items) 1 -}}
            {{- $pending = true -}}
            {{- else -}}
            {{- $group := (index $items 0).resource -}}
            {{- $id := ($group.status | default dict).objectId | default "" -}}
            {{- $ready := false -}}
            {{- range $condition := ($group.status | default dict).conditions -}}
            {{- if and (eq $condition.type "Ready") (eq $condition.status "True") -}}
            {{- $ready = true -}}
            {{- end -}}
            {{- end -}}
            {{- if or (not $id) (not $ready) -}}
            {{- $pending = true -}}
            {{- else -}}
            {{- $groups = append $groups (lower $id) -}}
            {{- end -}}
            {{- end -}}
            {{- end -}}
            {{- $groups = uniq $groups -}}
            {{- $catalogItems := (get $extra "resourceCatalog" | default dict).items | default list -}}
            {{- $catalogGroups := list -}}
            {{- if eq (len $catalogItems) 1 -}}
            {{- $catalogGroups = ((index $catalogItems 0).resource.status | default dict).groupAssociations | default list -}}
            {{- end -}}
            {{- $associations := dict -}}
            {{- range $association := $catalogGroups -}}
            {{- if and $association.id $association.ready -}}
            {{- $_ := set $associations (lower $association.groupId) $association.id -}}
            {{- end -}}
            {{- end -}}
            {{- range $id := $groups -}}
            {{- if not (hasKey $associations $id) -}}
            {{- $pending = true -}}
            {{- end -}}
            {{- end -}}
            {{- $pending = or $pending (not (get .desired.resources "accessPackage")) -}}
            {{- $package := getComposedResource . "accessPackage" | default dict -}}
            {{- $packageId := (($package.status | default dict).atProvider | default dict).id -}}
            {{- $pending = or $pending (and (gt (len $groups) 0) (not $packageId)) -}}
            {{- if $pending -}}
            {{- range $key, $resource := .observed.resources -}}
            {{- if not (get $.desired.resources $key) -}}
            {{- $preserved := pick $resource.resource "apiVersion" "kind" "spec" -}}
            {{- $_ := set $preserved "metadata" (pick $resource.resource.metadata "name" "namespace") -}}
            {{- $_ := set $preserved.metadata "annotations" (dict "gotemplating.fn.crossplane.io/composition-resource-name" $key) }}
            ---
            {{ $preserved | toJson }}
            {{- end -}}
            {{- end }}
            ---
            apiVersion: entraid.platform.example.org/v1alpha1
            kind: XAccessPackage
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/ready: "False"
            ---
            apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
            kind: ClaimConditions
            conditions:
              - type: GroupResourcesReady
                status: "False"
                reason: WaitingForCatalogGroups
                message: All requested groups must be registered and Ready in catalogRef.
            {{- else }}
            {{- if $packageId -}}
            {{- range $id := $groups -}}
            {{- $name := printf "package-%s.%s" $xr.metadata.uid $id }}
            ---
            apiVersion: identitygovernance.azuread.m.upbound.io/v1beta1
            kind: AccessPackageResourcePackageAssociation
            metadata:
              name: {{ $name }}
              namespace: {{ $xr.metadata.namespace }}
              annotations:
                {{ setResourceNameAnnotation (printf "groupPackageAssociations-%s" $name) }}
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                accessPackageId: {{ $packageId | quote }}
                accessType: Member
                catalogResourceAssociationId: {{ get $associations $id | quote }}
            {{- end -}}
            {{- end }}
            ---
            apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
            kind: ClaimConditions
            conditions:
              - type: GroupResourcesReady
                status: "True"
                reason: Available
                message: All requested group associations are present.
            {{- end }}
    - step: auto-ready
      functionRef:
        name: function-auto-ready
