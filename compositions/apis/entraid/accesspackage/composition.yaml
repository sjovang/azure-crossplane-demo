---
# yamllint disable rule:line-length
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: accesspackages.entraid.platform.example.org
spec:
  compositeTypeRef:
    apiVersion: entraid.platform.example.org/v1alpha1
    kind: XAccessPackage
  mode: Pipeline
  pipeline:
    - step: kro
      functionRef:
        name: function-kro
      input:
        apiVersion: kro.fn.crossplane.io/v1alpha1
        kind: ResourceGraph
        status:
          id: ${accessPackage.status.atProvider.id}
          assignmentPolicyId: ${assignmentPolicy.status.atProvider.id}
        resources:
          - id: catalog
            externalRef:
              apiVersion: entraid.platform.example.org/v1alpha1
              kind: XAccessPackageCatalog
              metadata:
                name: ${schema.spec.catalogRef.name}
          - id: primaryApproverGroup
            externalRef:
              apiVersion: entraid.platform.example.org/v1alpha1
              kind: XSecurityGroup
              metadata:
                name: ${schema.spec.primaryApproverGroupRef.name}
          - id: secondaryApproverGroup
            externalRef:
              apiVersion: entraid.platform.example.org/v1alpha1
              kind: XSecurityGroup
              metadata:
                name: ${schema.spec.secondaryApproverGroupRef.name}
          - id: accessPackage
            template:
              apiVersion: identitygovernance.azuread.m.upbound.io/v1beta1
              kind: AccessPackage
              metadata: {}
              spec:
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  catalogId: ${catalog.status.id}
                  displayName: ${schema.spec.name}
                  description: ${schema.spec.description}
          - id: groupPackageAssociations
            forEach:
              - groupId: ${schema.spec.groupIds}
            template:
              apiVersion: identitygovernance.azuread.m.upbound.io/v1beta1
              kind: AccessPackageResourcePackageAssociation
              metadata:
                name: >-
                  ${("package-" + schema.metadata.uid
                  + "." + groupId).lowerAscii()}
              spec:
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  accessPackageId: ${accessPackage.status.atProvider.id}
                  accessType: Member
                  catalogResourceAssociationId: >-
                    ${catalog.?status.?groupAssociations.orValue([]).filter(a,
                      a.groupId.lowerAscii() == groupId.lowerAscii()
                      && a.id != "" && a.ready)[0].id}
          - id: assignmentPolicy
            template:
              apiVersion: identitygovernance.azuread.m.upbound.io/v1beta1
              kind: AccessPackageAssignmentPolicy
              metadata: {}
              spec:
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  accessPackageId: ${accessPackage.status.atProvider.id}
                  displayName: ${schema.spec.name}
                  description: ${schema.spec.description}
                  requestorSettings:
                    requestsAccepted: true
                    scopeType: ${schema.spec.requestorScope}
                  approvalSettings:
                    approvalRequired: true
                    requestorJustificationRequired: true
                    approvalStage:
                      - approvalTimeoutInDays: ${double(schema.spec.approvalTimeoutDays)}
                        alternativeApprovalEnabled: true
                        enableAlternativeApprovalInDays: ${double(schema.spec.escalationAfterDays)}
                        primaryApprover:
                          - objectId: ${primaryApproverGroup.status.objectId}
                            subjectType: GroupMembers
                        alternativeApprover:
                          - objectId: ${secondaryApproverGroup.status.objectId}
                            subjectType: GroupMembers
                  assignmentReviewSettings:
                    enabled: true
                    reviewFrequency: ${schema.spec.reviewFrequency}
                    durationInDays: ${double(schema.spec.reviewDurationDays)}
                    reviewType: Reviewers
                    reviewer:
                      - objectId: ${primaryApproverGroup.status.objectId}
                        subjectType: GroupMembers
                      - objectId: ${secondaryApproverGroup.status.objectId}
                        subjectType: GroupMembers
                    accessReviewTimeoutBehavior: removeAccess
    # kro treats missing list entries as pending and omits the whole collection.
    # Fail closed after package creation, before Crossplane can prune associations.
    - step: check-group-resources
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr := .observed.composite.resource -}}
            {{- $count := 0 -}}
            {{- range $resource := .desired.resources -}}
            {{- if eq $resource.resource.kind "AccessPackageResourcePackageAssociation" -}}
            {{- $count = add1 $count -}}
            {{- end -}}
            {{- end -}}
            {{- if or (ne (int $count) (len ($xr.spec.groupIds | default list))) (not (get .desired.resources "accessPackage")) -}}
            {{- $package := getComposedResource . "accessPackage" | default dict -}}
            {{- if (($package.status | default dict).atProvider | default dict).id -}}
            {{- fail "Requested groups must all be registered and Ready in catalogRef before package associations can reconcile" -}}
            {{- end }}
            ---
            apiVersion: entraid.platform.example.org/v1alpha1
            kind: XAccessPackage
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/ready: "False"
            ---
            apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
            kind: ClaimConditions
            conditions:
              - type: GroupResourcesReady
                status: "False"
                reason: WaitingForCatalogGroups
                message: All requested groups must be registered and Ready in catalogRef.
            {{- else }}
            ---
            apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
            kind: ClaimConditions
            conditions:
              - type: GroupResourcesReady
                status: "True"
                reason: Available
                message: All requested group associations are present.
            {{- end }}
    - step: auto-ready
      functionRef:
        name: function-auto-ready
