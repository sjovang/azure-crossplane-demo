---
# Merged into the generated openAPIV3Schema by `make generate`.
properties:
  spec:
    required:
      - resourceGroupRef
      - virtualNetworkRef
    x-kubernetes-validations:
      - rule: self.os != 'linux' || has(self.sshPublicKeySecretRef)
        message: linux virtual machines require sshPublicKeySecretRef
      - rule: self.os != 'linux' || !has(self.adminPasswordSecretRef)
        message: >-
          linux virtual machines authenticate with SSH keys only,
          remove adminPasswordSecretRef
      - rule: self.os != 'windows' || has(self.adminPasswordSecretRef)
        message: windows virtual machines require adminPasswordSecretRef
      - rule: self.os != 'windows' || !has(self.sshPublicKeySecretRef)
        message: windows virtual machines do not support sshPublicKeySecretRef
    properties:
      resourceGroupRef:
        description: Resource group hosting the virtual machine.
      virtualNetworkRef:
        description: Virtual network and subnet hosting the NIC.
      adminPasswordSecretRef:
        description: >-
          Windows only. Secret in the same namespace holding the local
          administrator password.
        x-kubernetes-validations:
          - rule: self == oldSelf
            message: adminPasswordSecretRef is immutable
      sshPublicKeySecretRef:
        description: >-
          Linux only. Secret in the same namespace holding the OpenSSH public
          key authorised for the admin user.
        x-kubernetes-validations:
          - rule: self == oldSelf
            message: sshPublicKeySecretRef is immutable
