---
summary: >-
  An Azure Linux Web App and its Service Plan, using a container image.
stability: experimental
exampleRef: teams/crd-dev/apps.yaml
exampleLines: 11-22
exampleNotes: >-
  Create the referenced XResourceGroup before creating the app. The team
  example is disabled by default in its kustomization.yaml. Set the optional
  customDomain to add CNAME and asuid TXT records in an existing Azure DNS
  zone, bind the hostname, and issue a free App Service managed certificate.
  Key Vault secret references may pin a version; changing it updates app
  settings and forces App Service to refresh the referenced credential.
  XAppService readiness also waits for both the Service Plan and web app to
  report Synced=True; inspect their events for transient Azure API errors.
