---
apiVersion: azure.platform.example.org/v1alpha1
kind: XDataCollectionRule
spec:
  name: >-
    string | required=true immutable=true minLength=1 maxLength=63
    pattern="^[a-z0-9]+(?:-[a-z0-9]+)*$"
  resourceGroupName: string | required=true immutable=true minLength=1
  location: string | required=true immutable=true minLength=1
  profile: >-
    string | required=true immutable=true
    enum="vmInsights,changeTracking,defenderSql"
  workspaceId: >-
    string | required=true
    pattern="^/subscriptions/[^/]+/resourceGroups/[^/]+/providers/Microsoft.OperationalInsights/workspaces/[^/]+$"
  identityId: >-
    string | required=true
    pattern="^/subscriptions/[^/]+/resourceGroups/[^/]+/providers/Microsoft.ManagedIdentity/userAssignedIdentities/[^/]+$"
  providerConfigRef:
    kind: >-
      string | default="ClusterProviderConfig"
      enum="ProviderConfig,ClusterProviderConfig"
    name: string | default="default" minLength=1
status:
  id: string
  immutableId: string
  managedResourceName: string
