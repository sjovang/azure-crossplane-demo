---
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: diagnosticsettings.azure.platform.example.org
spec:
  compositeTypeRef:
    apiVersion: azure.platform.example.org/v1alpha1
    kind: XDiagnosticSetting
  mode: Pipeline
  pipeline:
    - step: patch-and-transform
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          - name: diagnosticSetting
            base:
              apiVersion: insights.azure.m.upbound.io/v1beta1
              kind: MonitorDiagnosticSetting
              spec:
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  enabledLog:
                    - category: Administrative
                    - category: Security
                    - category: ServiceHealth
                    - category: Alert
                    - category: Recommendation
                    - category: Policy
                    - category: Autoscale
                    - category: ResourceHealth
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.providerConfigRef
                toFieldPath: spec.providerConfigRef
              - type: FromCompositeFieldPath
                fromFieldPath: spec.name
                toFieldPath: spec.forProvider.name
              - type: FromCompositeFieldPath
                fromFieldPath: spec.subscriptionId
                toFieldPath: spec.forProvider.targetResourceId
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: /subscriptions/%s
              - type: FromCompositeFieldPath
                fromFieldPath: spec.workspaceId
                toFieldPath: spec.forProvider.logAnalyticsWorkspaceId
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.id
                toFieldPath: status.id
              - type: ToCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: status.managedResourceName
