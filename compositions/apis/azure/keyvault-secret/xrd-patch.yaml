---
# Merged into the generated openAPIV3Schema by `make generate`.
properties:
  spec:
    required:
      - keyVaultRef
      - valueSecretRef
    properties:
      keyVaultRef:
        description: XKeyVault selected by Kubernetes metadata.name.
        x-kubernetes-validations:
          - rule: self == oldSelf
            message: >-
              keyVaultRef is immutable; create a new XKeyVaultSecret for
              another vault
      valueSecretRef:
        description: Kubernetes Secret containing the value.
        x-kubernetes-validations:
          - rule: self == oldSelf
            message: valueSecretRef is immutable
