---
# NAP installs the NodePool and AKSNodeClass CRDs on the control plane.
# Keep these resources out of the root batch until their CRDs exist.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nap-workloads
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: true
  healthCheckExprs:
    - apiVersion: karpenter.sh/v1
      kind: NodePool
      current: >-
        status.conditions.exists(c,
        c.type == 'Ready' && c.status == 'True')
  path: ./clusters/aks/nap-workloads
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: flux-system
