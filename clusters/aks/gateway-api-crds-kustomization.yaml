---
# Gateway API + Envoy Gateway CRDs, installed before anything that watches
# them. cert-manager in particular only enables its Gateway support if the
# CRDs exist when it starts.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway-api-crds
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: true
  healthCheckExprs:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      current: >-
        status.conditions.exists(c,
        c.type == 'Ready' && c.status == 'True')
  path: ./clusters/aks/gateway-api-crds
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: flux-system
