---
# The Gateway API implementation. Its own CRDs come from gateway-api-crds,
# so the chart is installed with crds.enabled=false.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-gateway
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: true
  healthCheckExprs:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      current: >-
        status.conditions.exists(c,
        c.type == 'Ready' && c.status == 'True')
  path: ./clusters/aks/envoy-gateway
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: gateway-api-crds
