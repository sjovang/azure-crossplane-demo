---
apiVersion: v1
kind: Namespace
metadata:
  name: external-dns
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: external-dns
  namespace: external-dns
spec:
  interval: 1h
  url: https://kubernetes-sigs.github.io/external-dns/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: external-dns
spec:
  interval: 1h
  chart:
    spec:
      chart: external-dns
      version: "*"
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: external-dns
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    provider:
      name: azure
    # Reads hostnames from HTTPRoutes, narrowed by the parent Gateway's
    # listener, and takes the record target from the Gateway's
    # status.addresses.
    sources:
      - gateway-httproute
    # Hard limit on what this controller may ever touch. Without it a stray
    # HTTPRoute in any namespace could create records in other zones.
    domainFilters:
      - ${DNS_ZONE}
    # Identifies the TXT registry records this cluster owns, so a second
    # cluster sharing the zone cannot delete this one's records.
    txtOwnerId: ${CLUSTER_NAME}
    policy: sync
    # azure.json is created by infrastructure/bootstrap-aks.sh from the same
    # service principal the Crossplane provider uses.
    extraVolumes:
      - name: azure-config
        secret:
          secretName: external-dns-azure-config
    extraVolumeMounts:
      - name: azure-config
        mountPath: /etc/kubernetes
        readOnly: true
