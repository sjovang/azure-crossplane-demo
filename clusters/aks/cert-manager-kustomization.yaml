---
# dependsOn gateway-api-crds because enableGatewayAPI makes cert-manager
# watch Gateway resources at startup; without the CRDs it crash-loops.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 10m
  prune: true
  wait: true
  healthCheckExprs:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      current: >-
        status.conditions.exists(c,
        c.type == 'Ready' && c.status == 'True')
  path: ./clusters/aks/cert-manager
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: gateway-api-crds
