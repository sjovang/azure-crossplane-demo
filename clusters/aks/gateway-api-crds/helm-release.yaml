---
apiVersion: v1
kind: Namespace
metadata:
  name: envoy-gateway-system
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: envoy-gateway
  namespace: envoy-gateway-system
spec:
  type: oci
  interval: 1h
  url: oci://docker.io/envoyproxy
---
# Installed from the CRDs-only chart rather than letting the main
# gateway-helm chart bring them in, for two reasons: the bundled install
# defaults to the *experimental* Gateway API channel, and cert-manager must
# start after these CRDs exist, which needs them to be a separately
# orderable Kustomization.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gateway-api-crds
  namespace: envoy-gateway-system
spec:
  interval: 1h
  chart:
    spec:
      chart: gateway-crds-helm
      version: "1.9.x"
      sourceRef:
        kind: HelmRepository
        name: envoy-gateway
        namespace: envoy-gateway-system
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    crds:
      gatewayAPI:
        enabled: true
        # Standard channel only: nothing here needs TCPRoute/TLSRoute.
        channel: standard
      envoyGateway:
        enabled: true
