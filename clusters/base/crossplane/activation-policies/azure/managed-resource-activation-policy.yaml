---
# The only activation policy (the chart default is disabled in
# ../../core/helm-release.yaml). Every managed resource kind composed under
# compositions/ must be listed here, or its CRD is never created.
apiVersion: apiextensions.crossplane.io/v1alpha1
kind: ManagedResourceActivationPolicy
metadata:
  name: azure-resources
spec:
  activate:
    - resourcegroups.azure.m.upbound.io
    - managers.network.azure.m.upbound.io
    - manageripampools.network.azure.m.upbound.io
    - virtualnetworks.network.azure.m.upbound.io
    - subnets.network.azure.m.upbound.io
    - securitygroups.network.azure.m.upbound.io
    - subnetnetworksecuritygroupassociations.network.azure.m.upbound.io
    - networkinterfaces.network.azure.m.upbound.io
    - linuxvirtualmachines.compute.azure.m.upbound.io
    - windowsvirtualmachines.compute.azure.m.upbound.io
    - groups.groups.azuread.m.upbound.io
    - serviceplans.web.azure.m.upbound.io
    - linuxwebapps.web.azure.m.upbound.io
    - vaults.keyvault.azure.m.upbound.io
    - secrets.keyvault.azure.m.upbound.io
    - roleassignments.authorization.azure.m.upbound.io
    - environments.containerapp.azure.m.upbound.io
    - containerapps.containerapp.azure.m.upbound.io
    - flexibleservers.dbforpostgresql.azure.m.upbound.io
    - flexibleserverdatabases.dbforpostgresql.azure.m.upbound.io
    - flexibleserverfirewallrules.dbforpostgresql.azure.m.upbound.io
