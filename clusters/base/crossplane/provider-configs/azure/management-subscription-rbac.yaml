---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crossplane-management-subscription
  labels:
    rbac.crossplane.io/aggregate-to-crossplane: "true"
rules:
  - apiGroups: ["azure.m.upbound.io"]
    resources: ["providerconfigs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["azure.m.upbound.io"]
    resources: ["clusterproviderconfigs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["protection.crossplane.io"]
    resources: ["usages"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["azure.platform.example.org"]
    resources: ["xlandingzonearchitectures"]
    verbs: ["get", "list", "watch"]
