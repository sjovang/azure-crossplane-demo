---
# A separate Kustomization for the Provider package: its CRD
# (providers.pkg.crossplane.io) only exists once Crossplane core itself
# (installed from ../core) has finished installing, so it can't
# be applied in the same batch as the HelmRelease. dependsOn + its own retry
# loop lets it converge once ready, without blocking everything else in
# flux-system.
# wait + healthCheckExprs: Ready only once every package is Installed and
# Healthy (packages have no Ready condition, so plain kstatus would pass
# immediately), so dependents never start against half-installed packages.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: crossplane-azure-provider
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 10m
  wait: true
  healthCheckExprs:
    - apiVersion: pkg.crossplane.io/v1
      kind: Provider
      current: >-
        status.conditions.exists(c,
        c.type == 'Installed' && c.status == 'True')
        && status.conditions.exists(c,
        c.type == 'Healthy' && c.status == 'True')
  prune: true
  path: ./clusters/base/crossplane/providers/azure
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: flux-system
