---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  # Installing any family sub-provider also installs the shared
  # provider-family-azure meta-provider (handles auth) as a dependency. That
  # meta-provider is what owns resourcegroups.azure.m.upbound.io, so no
  # separate provider-azure-resources package is needed.
  name: provider-azure-network
spec:
  package: xpkg.upbound.io/upbound/provider-azure-network:v2.7.2
  runtimeConfigRef:
    name: azure-provider
