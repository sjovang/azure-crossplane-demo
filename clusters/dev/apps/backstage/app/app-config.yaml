---
app:
  title: Azure Crossplane Demo Developer Portal
  baseUrl: http://localhost:3000

organization:
  name: Azure Crossplane Demo

backend:
  baseUrl: http://localhost:7007
  listen:
    port: 7007
  csp:
    connect-src: ["'self'", 'http:', 'https:']
  cors:
    origin: http://localhost:3000
    methods: [GET, POST, PUT, DELETE]
    credentials: true
  # Base config only: no database configured yet, defaults to the in-memory
  # SQLite database. Add a `database:` block (e.g. Postgres) before relying
  # on this for anything beyond auth login testing.

auth:
  # Microsoft Entra ID (Azure AD) OIDC provider. This workshop has no user
  # catalog, so the resolver deliberately permits sign-in without a matching
  # User entity and derives the identity from the email local part.
  environment: development
  providers:
    microsoft:
      development:
        clientId: ${AUTH_MICROSOFT_CLIENT_ID}
        clientSecret: ${AUTH_MICROSOFT_CLIENT_SECRET}
        tenantId: ${AUTH_MICROSOFT_TENANT_ID}
        domainHint: ${AUTH_MICROSOFT_TENANT_ID}

# Base config only: no catalog locations registered yet. This is a
# follow-up phase (Crossplane XR/Composition catalog integration).
catalog:
  locations: []
