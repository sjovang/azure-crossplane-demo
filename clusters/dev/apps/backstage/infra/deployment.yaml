---
# Base config only: image is built locally and loaded into the kiac
# cluster's nodes with `kiac load image` (see this directory's README.md)
# -- no registry, in-cluster or external, is required. imagePullPolicy:
# Never enforces that kubelet uses the locally loaded image instead of
# attempting a registry pull. The backstage-entra-secret Secret is created
# automatically by infrastructure/bootstrap.sh (not committed to git).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage
  namespace: backstage
  labels:
    app.kubernetes.io/name: backstage
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backstage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backstage
    spec:
      containers:
        - name: backstage
          image: docker.io/library/backstage:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 7007
          env:
            # Backstage is reached through the kiac gateway addon's Traefik
            # Gateway (see infra/httproute.yaml) at the hostname below,
            # rather than via kubectl port-forward -- both the frontend and
            # backend base URLs point at it since the production build
            # serves the built frontend from the backend. ${BACKSTAGE_HOSTNAME}
            # is resolved by Flux's postBuild.substituteFrom -- see the
            # comment in infra/httproute.yaml and
            # clusters/dev/apps/backstage/README.md.
            - name: APP_BASE_URL
              value: http://${BACKSTAGE_HOSTNAME}
            - name: BACKEND_BASE_URL
              value: http://${BACKSTAGE_HOSTNAME}
            - name: AUTH_MICROSOFT_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: backstage-entra-secret
                  key: clientId
            - name: AUTH_MICROSOFT_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backstage-entra-secret
                  key: clientSecret
            - name: AUTH_MICROSOFT_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: backstage-entra-secret
                  key: tenantId
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
