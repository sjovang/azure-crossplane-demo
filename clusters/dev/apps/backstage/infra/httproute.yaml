---
# Attaches Backstage to the kiac gateway addon's pre-created Gateway
# (GatewayClass traefik, Gateway kiac in namespace kiac-gateway -- see
# https://github.com/saiyam1814/kiac/blob/main/examples/gateway-api-lab.md).
# Requires the cluster to have been created with the gateway addon enabled
# (infrastructure/config.yaml -> addons.gateway: true).
#
# ${BACKSTAGE_HOSTNAME} is resolved by Flux's postBuild.substituteFrom (see
# clusters/dev/apps-kustomization.yaml) from the backstage-vars ConfigMap,
# applied by infrastructure/set-backstage-hostname.sh -- not committed here
# so switching hostnames (backstage.local vs. a public domain you control,
# see clusters/dev/apps/backstage/README.md) never requires editing this
# file.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backstage
  namespace: backstage
spec:
  parentRefs:
    - name: kiac
      namespace: kiac-gateway
  hostnames:
    - ${BACKSTAGE_HOSTNAME}
  rules:
    - backendRefs:
        - name: backstage
          port: 7007
