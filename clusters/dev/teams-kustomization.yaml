# A separate Kustomization for teams/ (outside clusters/dev/, mimicking
# separate teams/repos sharing one demo cluster). dependsOn both
# flux-system and crossplane-compositions: a team's XResourceGroup manifest
# requires its CRD to be established before this batch applies. Keep the
# teams path explicitly scoped so Flux does not use an implicit recursive
# kustomization that mixes team resources into an uncontrolled batch (the
# same CRD-dependency deadlock this repo already hit with ProviderConfig/
# Provider).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: teams
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 2m
  prune: true
  path: ./teams
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: flux-system
    - name: crossplane-compositions
