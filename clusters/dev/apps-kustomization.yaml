---
# Pointer Kustomization for apps/ (currently: Backstage). No CRD-dependency
# deadlock risk here (plain Deployment/Service/Namespace), but it still gets
# its own scoped kustomization.yaml and dedicated Flux Kustomization CR per
# repo convention, rather than being swept into the root flux-system
# Kustomization's implicit recursive scan.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 2m
  prune: true
  path: ./clusters/dev/apps/backstage
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: flux-system
