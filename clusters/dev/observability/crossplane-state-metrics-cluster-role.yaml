apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crossplane-state-metrics
rules:
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - list
      - watch


  - apiGroups:
      - azure.platform.example.org
    resources:
      - xresourcegroups
    verbs:
      - list
      - watch
  - apiGroups:
      - azure.m.upbound.io
    resources:
      - resourcegroups
    verbs:
      - list
      - watch
