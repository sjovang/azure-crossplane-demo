---
# wait: true so this Kustomization only reports ready once the HelmRelease
# has installed the ExternalSecret/Password CRDs that teams/ depends on.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: true
  path: ./clusters/dev/external-secrets
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: flux-system
