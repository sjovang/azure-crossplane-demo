apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Deliberately not referenced from clusters/dev/kustomization.yaml or
# clusters/dev/crossplane/kustomization.yaml: this manifest's CRD only
# exists once the Azure Provider package has established itself, so it must
# only ever be applied by the dependent crossplane-azure-config Kustomization
# (../../flux-kustomizations/azure-provider-config-kustomization.yaml), which
# targets this directory directly and retries independently until the CRD is
# ready.
resources:
  - provider-config.yaml
