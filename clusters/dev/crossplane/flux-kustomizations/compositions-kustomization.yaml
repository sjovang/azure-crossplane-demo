---
# A separate Kustomization for shared Compositions/XRDs (compositions/,
# outside clusters/dev/ so other clusters can point at the same path).
# CompositeResourceDefinition/Composition are core Crossplane CRDs
# (established by the HelmRelease in ../core), so this only needs to
# wait on flux-system, not on any specific provider or function - applying
# these manifests doesn't require the functions/providers they reference to
# already exist (Crossplane only validates those at XR-reconcile time, not
# at apply/dry-run time).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: crossplane-compositions
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 2m
  prune: true
  path: ./compositions
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: flux-system
