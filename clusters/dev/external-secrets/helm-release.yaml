---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 1h
  chart:
    spec:
      chart: external-secrets
      # "*" tracks the latest stable chart release automatically.
      version: "*"
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: external-secrets
  targetNamespace: external-secrets
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
