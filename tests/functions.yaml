---
# Function packages used by `crossplane render` composition tests. Mirrors
# clusters/dev/crossplane/functions/*.yaml (kept in sync manually) but
# without the Kustomization resource, which `crossplane render` can't parse.
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-patch-and-transform
spec:
  package:
    xpkg.crossplane.io/crossplane-contrib/function-patch-and-transform:v0.10.10
---
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-go-templating
spec:
  package:
    xpkg.crossplane.io/crossplane-contrib/function-go-templating:v0.12.4
---
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-kro
spec:
  package:
    xpkg.crossplane.io/crossplane-contrib/function-kro:v0.3.0
---
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-auto-ready
spec:
  package:
    xpkg.crossplane.io/crossplane-contrib/function-auto-ready:v0.5.0
