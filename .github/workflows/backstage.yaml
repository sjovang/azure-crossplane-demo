---
# yamllint disable rule:line-length rule:truthy
#
# line-length: actions are pinned to full 40-character commit SHAs, which
#   zizmor requires and which cannot be wrapped.
# truthy: `on:` is the GitHub Actions trigger key, not a boolean.
#
# Builds the Backstage developer portal in apps/backstage into a container
# image. Pull requests (including Renovate updates) only build it. On main the
# image is pushed to GHCR and its immutable tag is committed into the
# developer-portal team's XWebApplication, which Crossplane rolls out to App
# Service.
#
# Commits pushed with GITHUB_TOKEN deliberately do not trigger workflows, so
# the commit made by the last step cannot start another run.
name: backstage

on:
  push:
    branches:
      - main
    paths:
      - apps/backstage/**
      - .github/workflows/backstage.yaml
  pull_request:
    paths:
      - apps/backstage/**
      - .github/workflows/backstage.yaml
  workflow_dispatch:

permissions: {}

concurrency:
  group: backstage-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}/backstage

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: apps/backstage
          push: false
          platforms: linux/amd64
          cache-from: type=gha

  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # commits the new image tag back to main
      packages: write  # pushes the image to GHCR
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the image tag
        id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >>"$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: apps/backstage
          push: true
          # App Service runs on amd64 only.
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Commit the new image tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          IMAGE: ${{ env.IMAGE }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          manifest=teams/developer-portal/webapplication.yaml

          # Replace only the tag, so the image name stays as written.
          sed -i -E "s|(image: ${IMAGE}):.*|\1:${TAG}|" "$manifest"

          if git diff --quiet -- "$manifest"; then
            echo "Image tag already up to date, nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$manifest"
          git commit -m "chore(backstage): publish backstage ${TAG}"
          git push \
            "https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git" \
            "HEAD:${GITHUB_REF_NAME}"
