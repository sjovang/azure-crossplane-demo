---
# yamllint disable rule:line-length rule:truthy
name: app-hosting-advisor

on:
  push:
    branches:
      - main
    paths:
      - apps/app-hosting-advisor/**
      - compositions/**
      - .github/workflows/app-hosting-advisor.yaml
  pull_request:
    paths:
      - apps/app-hosting-advisor/**
      - compositions/**
      - .github/workflows/app-hosting-advisor.yaml
  workflow_dispatch:

permissions: {}

concurrency:
  group: app-hosting-advisor-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}/app-hosting-advisor

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: apps/app-hosting-advisor/Dockerfile
          push: false
          platforms: linux/amd64
          cache-from: type=gha

  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the image tag
        id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >>"$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: apps/app-hosting-advisor/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Commit the new image tag
        env:
          IMAGE: ${{ env.IMAGE }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          manifest=teams/app-hosting-advisor/infrastructure.yaml
          sed -i -E "s|(image: ${IMAGE}):.*|\1:${TAG}|" "$manifest"

          if git diff --quiet -- "$manifest"; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$manifest"
          git commit -m "chore(app-hosting-advisor): publish ${TAG}"
          git push \
            "https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git" \
            "HEAD:${GITHUB_REF_NAME}"
