# yamllint disable rule:line-length rule:truthy
name: azure-vm-sku-function

on:
  push:
    branches:
      - main
    paths:
      - functions/azure-vm-sku/**
      - clusters/base/crossplane/functions/azure-vm-sku.yaml
      - compositions/crossplane-project.yaml
      - .github/workflows/azure-vm-sku-function.yaml
  pull_request:
    paths:
      - functions/azure-vm-sku/**
      - clusters/base/crossplane/functions/azure-vm-sku.yaml
      - compositions/crossplane-project.yaml
      - .github/workflows/azure-vm-sku-function.yaml

permissions: {}

concurrency:
  group: azure-vm-sku-function-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}/function-azure-vm-sku
  CROSSPLANE_VERSION: v2.5.0
  CROSSPLANE_SHA256: 065dd6b40c9ea5fc71e49900d5c924cc0bec7f58375922ddbde6b402f292347e

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build the runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: functions/azure-vm-sku
          push: false
          load: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}:runtime
          cache-from: type=gha

      - name: Install Crossplane CLI
        run: |
          set -euo pipefail
          curl -fsSLo "$RUNNER_TEMP/crossplane" \
            "https://cli.crossplane.io/stable/${CROSSPLANE_VERSION}/bin/linux_amd64/crossplane"
          echo "${CROSSPLANE_SHA256}  $RUNNER_TEMP/crossplane" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/crossplane"

      - name: Build the Crossplane package
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/crossplane" xpkg build \
            --package-root=functions/azure-vm-sku/package \
            --embed-runtime-image="${IMAGE}:runtime" \
            --package-file="$RUNNER_TEMP/function-azure-vm-sku.xpkg"

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: functions/azure-vm-sku
          push: false
          load: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}:runtime
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Crossplane CLI
        run: |
          set -euo pipefail
          curl -fsSLo "$RUNNER_TEMP/crossplane" \
            "https://cli.crossplane.io/stable/${CROSSPLANE_VERSION}/bin/linux_amd64/crossplane"
          echo "${CROSSPLANE_SHA256}  $RUNNER_TEMP/crossplane" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/crossplane"

      - name: Build and publish the Crossplane package
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          package_ref=$(sed -n 's/^  package: //p' \
            clusters/base/crossplane/functions/azure-vm-sku.yaml)
          expected_prefix="ghcr.io/${GITHUB_REPOSITORY}/function-azure-vm-sku:"
          if [[ "$package_ref" != "$expected_prefix"* ]]; then
            echo "unexpected Function package reference: $package_ref" >&2
            exit 1
          fi
          "$RUNNER_TEMP/crossplane" xpkg build \
            --package-root=functions/azure-vm-sku/package \
            --embed-runtime-image="${IMAGE}:runtime" \
            --package-file="$RUNNER_TEMP/function-azure-vm-sku.xpkg"
          "$RUNNER_TEMP/crossplane" xpkg push \
            --oci-annotation="org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --package-files="$RUNNER_TEMP/function-azure-vm-sku.xpkg" \
            "$package_ref"
