---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: crd-dev
resources:
  - ../_base
  #- network.yaml
  #- virtualmachines.yaml
  # - apps.yaml
  #- entraid.yaml
patches:
  - target:
      group: azure.platform.example.org
    patch: |-
      - op: add
        path: /spec/location
        value: swedencentral
  # Sweden Central has no Container Apps environment capacity.
  - target:
      kind: XContainerApp
    patch: |-
      - op: add
        path: /spec/location
        value: northeurope
