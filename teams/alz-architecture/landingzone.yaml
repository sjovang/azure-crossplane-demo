---
apiVersion: azure.platform.example.org/v1alpha1
kind: XLandingZoneArchitecture
metadata:
  name: alz-architecture
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  name: alz-architecture
  environmentConfigRef:
    name: azure-platform
  managementGroups:
    - name: alz
      displayName: Azure Landing Zones
      archetypes:
        - root
    - name: platform
      displayName: Platform
      archetypes:
        - platform
      parentRef:
        name: alz
    - name: landingzones
      displayName: Landing zones
      archetypes:
        - landing-zones
      parentRef:
        name: alz
    - name: corp
      displayName: Corp
      archetypes:
        - corp
      parentRef:
        name: landingzones
    - name: online
      displayName: Online
      archetypes:
        - online
      parentRef:
        name: landingzones
    - name: local
      displayName: Local
      archetypes:
        - local
      parentRef:
        name: landingzones
    - name: sandbox
      displayName: Sandbox
      archetypes:
        - sandbox
      parentRef:
        name: alz
    - name: security
      displayName: Security
      archetypes:
        - security
      parentRef:
        name: platform
    - name: management
      displayName: Management
      archetypes:
        - management
      parentRef:
        name: platform
    - name: connectivity
      displayName: Connectivity
      archetypes:
        - connectivity
      parentRef:
        name: platform
    - name: identity
      displayName: Identity
      archetypes:
        - identity
      parentRef:
        name: platform
    - name: decommissioned
      displayName: Decommissioned
      archetypes:
        - decommissioned
      parentRef:
        name: alz
  subscriptions: []
