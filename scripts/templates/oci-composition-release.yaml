---
# yamllint disable rule:line-length rule:truthy
#
# Generated by scripts/scaffold-oci-composition.sh. Keep this workflow
# dedicated to one composition so every package has an independent semver.
name: release __COMPONENT__ composition

on:
  push:
    branches:
      - main
    paths:
      - __PACKAGE_PATH__/**
      - .github/workflows/release-__COMPONENT__.yaml
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-__COMPONENT__
  cancel-in-progress: false

env:
  COMPONENT: __COMPONENT__
  IMAGE: ghcr.io/${{ github.repository }}/compositions/__COMPONENT__
  PACKAGE_PATH: __PACKAGE_PATH__

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      packages: write
      pull-requests: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Create or update the release
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071  # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: __PACKAGE_PATH__/release-please-config.json
          manifest-file: __PACKAGE_PATH__/.release-please-manifest.json

      - name: Set up Flux
        if: steps.release.outputs.releases_created == 'true'
        uses: fluxcd/flux2/action@8454b02a32e48d775b9f563cb51fdcb1787b5b93  # v2.7.5

      - name: Log in to GHCR
        if: steps.release.outputs.releases_created == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the Flux OCI artifact
        if: steps.release.outputs.releases_created == 'true'
        run: |
          set -euo pipefail
          version=$(cat "${PACKAGE_PATH}/.release-please-version")
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-].*)?$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi

          flux push artifact "${IMAGE}:v${version}" \
            --path="$PACKAGE_PATH" \
            --source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --revision="${GITHUB_REF_NAME}@sha1:${GITHUB_SHA}"
