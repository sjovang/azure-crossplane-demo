---
# Generated by scripts/scaffold-oci-composition.sh. Remove both suspend fields
# only after the first GHCR artifact exists and the package is public.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: composition-__COMPONENT__
  namespace: flux-system
spec:
  interval: 5m
  suspend: true
  url: oci://ghcr.io/sjovang/azure-crossplane-demo/compositions/__COMPONENT__
  ref:
    semver: "^1.0.0"
    semverFilter: "^v"
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: composition-__COMPONENT__
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 5m
  suspend: true
  wait: true
  healthCheckExprs:
    - apiVersion: apiextensions.crossplane.io/v2
      kind: CompositeResourceDefinition
      current: >-
        status.conditions.exists(c,
        c.type == 'Established' && c.status == 'True')
  prune: true
  path: ./
  sourceRef:
    kind: OCIRepository
    name: composition-__COMPONENT__
  dependsOn:
    - name: flux-system
    - name: crossplane-functions
