---
# Vendored Yarn release and lockfile are generated; editing them breaks Yarn.
exclude: ^apps/backstage/(\.yarn/releases/|yarn\.lock$)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-merge-conflict
      - id: check-json
      - id: check-yaml
        args: [
          '--allow-multiple-documents',
        ]
        # gotk-* are Flux-generated; mkdocs.yml uses a PyMdown !!python/name:
        # tag that plain PyYAML cannot construct.
        exclude: >-
          (?x)^(
            clusters/(local|aks)/flux-system/(gotk-components|gotk-sync)\.yaml
            |apps/docs/mkdocs\.yml
          )$
      - id: detect-private-key
      - id: mixed-line-ending
        args: [
          '--fix=lf',
        ]
      - id: pretty-format-json
        args: [
          --autofix,
          --no-ensure-ascii,
          --no-sort-keys
        ]
      - id: trailing-whitespace
        args: [
          --markdown-linebreak-ext=md
        ]

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        # Upstream-rendered CRDs retain their generated formatting.
        exclude: >-
          (?x)^(
            clusters/(local|aks)/flux-system/
            |clusters/aks/gateway-api-crds/crds\.yaml$
          )

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.26.1
    hooks:
      - id: zizmor
        args: [
          --no-progress,
          --fix
        ]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
