---
# yamllint disable rule:line-length
site_name: Crossplane Demo Platform
site_description: >-
  Reference documentation for the Crossplane compositions available in this
  cluster.
# Baked into every canonical link and into sitemap.xml at build time, so it
# cannot be substituted by Flux like the manifests are. A fork serving the
# site on another hostname overrides it with the DOCS_SITE_URL build arg.
site_url: !ENV [DOCS_SITE_URL, 'https://docs.demo.liasis.dev/']
repo_url: https://github.com/sjovang/azure-crossplane-demo
repo_name: sjovang/azure-crossplane-demo
edit_uri: blob/main/
docs_dir: docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  # Use the modern Zensical variant with an Azure-blue palette.
  variant: modern
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: blue
      accent: indigo
      toggle:
        icon: lucide/sun
        name: Switch to dark mode
    - scheme: slate
      primary: light-blue
      accent: cyan
      toggle:
        icon: lucide/moon
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  # gen-files is not supported by Zensical. scripts/gen_pages.py runs as a
  # separate step before the build instead; see README.md.
  - literate-nav:
      nav_file: SUMMARY.md
  - section-index

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - docs
        - ../..
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra:
  status:
    experimental: Experimental
