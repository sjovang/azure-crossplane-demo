---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: docs-site
  namespace: documentation-site
spec:
  parentRefs:
    - name: docs-site
      sectionName: https
  hostnames:
    - ${DOCS_HOSTNAME}
  rules:
    - backendRefs:
        - name: docs-site
          port: 80
---
# Everything arriving on port 80 is redirected, so the site is only ever
# served over TLS.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: docs-site-https-redirect
  namespace: documentation-site
spec:
  parentRefs:
    - name: docs-site
      sectionName: http
  hostnames:
    - ${DOCS_HOSTNAME}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
