---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Applied only by clusters/aks: publishes the site from ../base at a public
# hostname with a Let's Encrypt certificate. A local cluster cannot obtain a
# certificate for a public name, so it runs ../base alone.
resources:
  - envoy-proxy.yaml
  - gateway.yaml
  - httproute.yaml
