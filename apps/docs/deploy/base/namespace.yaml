---
apiVersion: v1
kind: Namespace
metadata:
  name: documentation-site
  labels:
    # The site is a plain static file server: it needs no privileges at all,
    # so it can satisfy the strictest Pod Security Standard.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
