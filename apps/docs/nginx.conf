server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # MkDocs builds directory-style URLs, so /reference/xvirtualmachine/
    # must resolve to that directory's index.html.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Hashed assets are safe to cache for a long time; HTML is not, because a
    # new image must be visible immediately after a deploy.
    location ~* \.(css|js|woff2?|svg|png|jpg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /404.html {
        internal;
    }

    error_page 404 /404.html;

    # Served behind a Gateway that terminates TLS, so these are the only
    # headers worth setting here.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml;
    gzip_min_length 1024;
}
